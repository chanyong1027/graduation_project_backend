# src/main/resources/application.yml

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/BookProject
    username: bookproject
    password: ${DB_PASSWORD}  # 👈 환경 변수로 변경

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  # 이메일 설정 (Gmail SMTP)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}  # Gmail 주소
    password: ${MAIL_PASSWORD}  # Gmail 앱 비밀번호
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# JWT 설정
jwt:
  secret: ${JWT_SECRET} # 👈 환경 변수로 변경
  token-validity-in-seconds: 3600  # Access Token: 1시간
  refresh-token-validity-in-seconds: 604800  # Refresh Token: 7일

logging:
  level:
    org.springframework.boot.autoconfigure: info

external:
  api:
    aladin: ${ALADIN_API_KEY}      # 👈 환경 변수로 변경
    data4library: ${DATA4LIBRARY_API_KEY} # 👈 환경 변수로 변경
    kakao: ${KAKAO_API_KEY}
